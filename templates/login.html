<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FAFA — 登录</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e0e0e0;
    }

    .login-card {
      width: 360px;
      background: #1a1a2e;
      border: 1px solid #2a2a45;
      border-radius: 12px;
      padding: 40px 36px 36px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .login-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .login-logo img {
      width: 52px;
      height: 52px;
      object-fit: contain;
    }

    .login-title {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .login-subtitle {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin-bottom: 32px;
      letter-spacing: 0.03em;
    }

    .login-error {
      background: rgba(255, 74, 74, 0.12);
      border: 1px solid rgba(255, 74, 74, 0.35);
      border-radius: 6px;
      color: #ff6b6b;
      font-size: 13px;
      padding: 10px 14px;
      margin-bottom: 20px;
      text-align: center;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: #888;
      letter-spacing: 0.05em;
      margin-bottom: 7px;
    }

    .field input {
      width: 100%;
      background: #111128;
      border: 1px solid #2e2e50;
      border-radius: 7px;
      padding: 11px 14px;
      font-size: 14px;
      color: #e0e0e0;
      outline: none;
      transition: border-color 0.15s;
    }

    .field input:focus {
      border-color: #4a9eff;
    }

    .field input::placeholder {
      color: #3a3a5a;
    }

    .login-btn {
      width: 100%;
      background: #4a9eff;
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: 0.03em;
    }

    .login-btn:hover {
      background: #2d7fd6;
    }

    .login-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <img src="/static/fafa-logo.png" alt="FAFA">
    </div>
    <div class="login-title">FAFA</div>
    <div class="login-subtitle">FIT 骑行数据分析平台</div>

    <div id="login-error" class="login-error"{% if not error %} style="display:none"{% endif %}>{{ error or '' }}</div>

    <form id="login-form" method="post" action="/login">
      <div class="field">
        <label>用户名</label>
        <input type="text" name="username" placeholder="输入用户名" autocomplete="username" autofocus required>
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" name="password" placeholder="输入密码" autocomplete="current-password" required>
      </div>
      <button type="submit" id="login-btn" class="login-btn">登录</button>
    </form>
  </div>
  <script src="/static/login.js"></script>
</body>
</html>
