name: CI

# 门控与构建合并在同一个 workflow：分成两个文件时它们是并行跑的，
# 镜像可能在质量门失败的情况下照样发布出去。build 通过 needs 等 quality 通过。
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      no_cache:
        description: 禁用构建缓存（--no-cache）
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    name: 质量门
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          PIP_ARGS="-i https://pypi.tuna.tsinghua.edu.cn/simple --trusted-host pypi.tuna.tsinghua.edu.cn"
          python -m pip install --upgrade pip $PIP_ARGS
          python -m pip install -r requirements.txt $PIP_ARGS
          # 没有这两个包时 python-security 与 docker-compose-yaml 会被跳过，
          # 等于这两项检查在 CI 里从未真正执行过
          python -m pip install bandit PyYAML $PIP_ARGS

      - name: Run quality gate
        run: python scripts/quality.py check --ci

  build:
    name: 构建并推送镜像
    needs: quality
    # 门控对所有分支和 PR 都跑，但只有 main、v* 标签和手动触发才出镜像
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push
        run: |
          chmod +x buildx.sh
          extra=""
          if [ "${{ github.event.inputs.no_cache }}" = "true" ]; then
            extra="--no-cache"
          fi
          ./buildx.sh linux/amd64,linux/arm64 $extra
